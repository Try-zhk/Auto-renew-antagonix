name: Antagonix-Renew

on:
  # 由外部定时（cron 面板）通过 workflow_dispatch 触发
  workflow_dispatch:
  schedule:
    # 备用：GitHub 原生定时（北京时间 10:00），5 天周期每天跑一次足够
    - cron: '0 2 * * *'

# 同一时刻只跑一个
concurrency:
  group: antagonix-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Antagonix-Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: |
          cp private/antagonix_renew.py antagonix_renew.py
          cp private/linktosb.py linktosb.py

      - name: 🐍 安装 Python 依赖
        run: pip install requests patchright pynacl --quiet

      - name: 🌐 安装浏览器依赖（patchright + 真 Chrome，Turnstile 过盾用）
        run: |
          google-chrome --version || python -m patchright install --with-deps chrome
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }

      - name: 🌐 启动 sing-box 代理转发（设置 PROXY_URL 时生效）
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URL_BACKUP: ${{ secrets.PROXY_URL_BACKUP }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "ℹ️ 未设置 PROXY_URL，跳过 sing-box 代理启动（直连模式）。"
            exit 0
          fi
          SB_ARCHIVE=$(ls private/sing-box-*-linux-amd64.tar.gz 2>/dev/null | head -n1)
          if [ -z "$SB_ARCHIVE" ]; then
            echo "❌ 私库里没找到 sing-box-*-linux-amd64.tar.gz"
            exit 1
          fi
          mkdir -p sb_extract
          tar -xzf "$SB_ARCHIVE" --strip-components=1 -C sb_extract
          cp sb_extract/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version

          cat > proxy_lib.sh <<'SH'
          mask_ip() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.**/g'; }
          start_proxy() {
            local ROLE="$1" URL="$2" PID OUT i
            pkill -f "sing-box run" >/dev/null 2>&1 || true
            for i in $(seq 1 10); do
              ss -ltn 2>/dev/null | grep -q ':8080 ' || break
              sleep 0.5
            done
            if ss -ltn 2>/dev/null | grep -q ':8080 '; then
              pkill -9 -f "sing-box run" >/dev/null 2>&1 || true
              sleep 1
            fi
            python3 linktosb.py "$URL" -o singbox.json --port 8080 || return 1
            ./sing-box check -c singbox.json || return 1
            nohup ./sing-box run -c singbox.json > singbox.log 2>&1 &
            PID=$!
            sleep 3
            kill -0 "$PID" 2>/dev/null || return 1
            if OUT=$(curl -sS -m 12 --proxy http://127.0.0.1:8080 https://checkip.amazonaws.com); then
              echo "✅ [$ROLE] 代理就绪，出口 IP：$(echo "$OUT" | mask_ip)"
              return 0
            fi
            echo "❌ [$ROLE] 代理连通性测试失败"
            return 1
          }
          SH
          source ./proxy_lib.sh
          if ! start_proxy "主用" "$PROXY_URL"; then
            if [ -n "$PROXY_URL_BACKUP" ]; then
              start_proxy "备用" "$PROXY_URL_BACKUP" || { echo "❌ 主备均不可用"; exit 1; }
            else
              echo "❌ 主用代理不可用，且未设置备用代理"
              exit 1
            fi
          fi

      - name: 🟣 执行续期（有头浏览器 + xvfb）
        env:
          ANX_SESSION: ${{ secrets.ANX_SESSION }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT: ${{ secrets.TG_BOT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HEADLESS: "0"
          MAX_RUN_SECONDS: "600"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            python -u antagonix_renew.py

      - name: 📸 上传过盾失败截图（如有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-fail-screenshots
          path: turnstile_fail_*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 📨 工作流级失败兜底通知
        if: failure()
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          if [ -z "$TG_BOT" ]; then
            echo "ℹ️ 未设置 TG_BOT，跳过兜底通知。"
            exit 0
          fi
          CHAT_ID="${TG_BOT%%,*}"
          BOT_TOKEN="${TG_BOT#*,}"
          RUN_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S (北京时间)')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG=$(printf '%s\n%s\n%s\n%s' \
            "🟣 Antagonix 续期通知" \
            "🕐 运行时间: ${RUN_TIME}" \
            "📊 结果: ❌ 任务失败！" \
            "📝 原因: 在脚本运行之前（私库拉取/代理阶段）就已失败，此为工作流级兜底。详情：${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null || true
